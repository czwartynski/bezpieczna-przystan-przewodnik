name: Wersja demonstracyjna

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build web --base-href "/${GITHUB_REPOSITORY#*/}/" --no-web-resources-cdn
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: web
    runs-on: ubuntu-latest
    concurrency:
      group: pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
